[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sycophancy-benchmark"
version = "0.1.0"
description = "Reproducible two-turn sycophancy benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "numpy>=1.24",
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
api = ["openai>=1.30"]
vllm = ["vllm>=0.5"]
annotation = ["openpyxl>=3.1"]
figures = [
  "matplotlib>=3.8",
  "scipy>=1.11",
]
presentation = [
  "Pillow>=10",
  "python-pptx>=0.6.23",
]
train = [
  "accelerate>=1.8,<2",
  "datasets>=4,<5",
  "peft>=0.17,<0.18",
  "torch>=2.7",
  "transformers>=4.55,<4.56",
  "trl>=0.20,<0.21",
]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sycophancy = "sycophancy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
